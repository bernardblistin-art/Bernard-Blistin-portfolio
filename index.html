<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bernard Blistin — Visual Artist</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url("Portrait couleur.jpg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .contact {
      position: absolute;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .contact:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="contact" href="mailto:Bernard.blistin@gmail.com">
      CONTACT — Bernard.blistin@gmail.com
    </a>
  </main>
</body>
</html>
